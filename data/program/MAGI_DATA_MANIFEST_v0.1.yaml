# MAGI DATA MANIFEST v0.1
# PILOT_V0.1 is the only ingestable scope after MAGI_DATA_PILOT_APPROVED=1.
# Production full ingest does NOT exist yet — MAGI_DATA_PRODUCTION_APPROVED is unset by design.
# Bulk download: CLOUD ONLY. Forbidden on local workstation.
# Format: MAGI simple-YAML (no list items) for stdlib loader.

meta:
  name: MAGI_DATA_MANIFEST
  version: v0.1
  pilot_name: MAGI_DATA_PILOT_v0.1
  program_parent: MAGI-5.5GTBS
  company: NULLXES
  status: awaiting_author_signoff_MAGI_DATA_PILOT_v0.1
  claim_class_mixture: EXPERIMENTAL_HYPOTHESIS
  download_policy: cloud_only_after_approval
  local_workstation_download: FORBIDDEN
  approval_gate: author_must_approve_MAGI_DATA_PILOT_v0.1_before_any_ingest
  next_phase_ref: data/program/MAGI_NEXT_PHASE_v0.1.yaml
  hub_metadata_checked: "2026-08-11"

layers:
  BASE:
    trains: language_world_code_stem
    model_gate: MAGI-35B-MoE-A8B_pretrain
  CASUAL:
    trains: informal_dialogue_registers
    model_gate: posttrain_after_BASE
  CHARACTER:
    trains: nullxes_magi_behavioral_identity
    model_gate: preference_or_sft_after_CASUAL
    mass_synthetic: FORBIDDEN
    base_ingest: NOT_APPROVED_FOR_BASE

approval:
  scope: MAGI_DATA_PILOT_v0.1
  pilot_only: true
  production_ingest: false
  require_env_pilot: MAGI_DATA_PILOT_APPROVED
  require_env_production: MAGI_DATA_PRODUCTION_APPROVED
  legacy_env_alias: MAGI_DATA_MANIFEST_APPROVED
  notes: "legacy MAGI_DATA_MANIFEST_APPROVED=1 maps to PILOT only, never production full dump"

base_mixture_v0_1:
  mixture_status: EXPERIMENTAL_HYPOTHESIS
  production_weighting_approved: false
  claim_class: HYPOTHESIS
  notes: "Do NOT treat bucket weights as approved production mix. Reweight after pilot metrics."
  buckets:
    ru_natural_web_documents: 0.25
    en_natural_web_documents: 0.25
    code: 0.18
    stem_scientific: 0.10
    mathematics: 0.07
    long_form_books_manuals: 0.05
    encyclopedic: 0.04
    structured_data: 0.03
    other_multilingual: 0.03

pilot_v0_1:
  name: MAGI_DATA_PILOT_v0.1
  status: AWAITING_AUTHOR_APPROVAL
  scope: MAGI_DATA_PILOT_v0.1
  purpose: data_pipeline_pilot_for_tokenizer_then_base
  mixture_status: EXPERIMENTAL_HYPOTHESIS
  production_weighting_approved: false
  character_in_base: NOT_APPROVED_FOR_BASE
  distillation_in_base: NOT_APPROVED_FOR_BASE
  sft_in_base: NOT_APPROVED_FOR_BASE
  synthetic_generator_for_base: NOT_APPROVED_FOR_BASE
  expected_accepted_text_gb_min: 20
  expected_accepted_text_gb_max: 35
  metrics_required_before_production_mix:
    raw_docs: true
    accepted_docs: true
    dedup_rate: true
    language_purity: true
    quality_distribution: true
    tokenizer_fertility: true
    tokens_per_domain: true
    contamination: true
  tokenizer_policy:
    tokenizer_training_before_final_mix: false
    tokenizer_experiments_after_pilot_ingest: true
    vocab_sweep: "65536,98304,131072,163840"
    algorithms: "byte_bpe,unigram"
  allowed_candidates:
    fineweb2: true
    the_stack_v2: true
    finemath: true
    wikimedia_wikipedia: true
    nullxes_domain: true
  sources:
    fineweb2_ru:
      candidate: fineweb2
      lang: ru
      accepted_text_gb_min: 5
      accepted_text_gb_max: 10
      role: natural_russian
    fineweb2_en:
      candidate: fineweb2
      lang: en
      accepted_text_gb_min: 5
      accepted_text_gb_max: 10
      role: natural_english
    stack_python:
      candidate: the_stack_v2
      lang: python
      accepted_text_gb_min: 3
      accepted_text_gb_max: 5
      per_repo_license_gate: required
    stack_typescript:
      candidate: the_stack_v2
      lang: typescript
      accepted_text_gb_min: 2
      accepted_text_gb_max: 3
      per_repo_license_gate: required
    finemath_slice:
      candidate: finemath
      accepted_text_gb_min: 2
      accepted_text_gb_max: 3
      role: math_slice
    wikipedia_ru_en:
      candidate: wikimedia_wikipedia
      langs: "ru,en"
      accepted_text_gb_min: 2
      accepted_text_gb_max: 3
      role: factual_document_slice
    nullxes_approved_slice:
      candidate: nullxes_domain
      role: approved_internal_only
      notes: "only already-approved NULLXES slice; no expansion without author"

code_language_priority:
  primary: "python,typescript,javascript,c,cpp,rust,sql,bash,cuda"
  markup_config: "json,yaml,markdown,html,css"
  reject_as_equal_weight: esoteric_languages_for_vanity_counts
  pilot_languages: "python,typescript"

