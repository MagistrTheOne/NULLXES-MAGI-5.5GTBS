# MAGI-7B v0.1 — H200 single-GPU intelligence bring-up
# Dense decoder in the CASUAL family. Full AdamW fits 1x H200 141GB.
# Not a substitute for MAGI-35B/400B ladder. Vocab 8192 pairs with T4 smoke tokenizer
# for immediate trainability; production shared vocab remains 131072.

meta:
  name: MAGI-7B
  version: v0.1
  program_parent: MAGI-5.5GTBS
  status: h200_intelligence_bringup
  from_zero: true
  model_class: dense_decoder
  primary_role: language_bringup
  parent_family: magi_casual
  tokenizer_ref: configs/tokenizer_t4_smoke_v0.1.yaml
  hf_architecture: MagiForCausalLM

architecture:
  type: decoder_only_prenorm_dense
  d_model: 4096
  n_layers: 36
  n_heads: 32
  n_kv_heads: 8
  d_head: 128
  d_ff: 11008
  vocab_size: 8192
  tied_embeddings: true
  norm: rmsnorm
  rmsnorm_eps: 1.0e-6
  activation: swiglu
  positional: rope
  rope_theta: 1000000.0
  bias: false
  attention: gqa
  train_context: 4096
  infer_context: 8192
  moe: false

init:
  emb_std: 0.02
  residual_std_formula: "0.02 / sqrt(2 * n_layers)"
  claim_class: HYPOTHESIS

precision:
  proxy: bf16
  production: bf16
  master_weights: fp32
  loss: fp32

hardware:
  target: H200_SXM
  gpu_vram_gb: 141
  dtype: bfloat16
  recommended_batch: 1
  recommended_seq: 2048
  notes: "bf16 weights + fp32 AdamW; seq 2048 batch 1 expected under ~100GB with activations"

tokenizer:
  id: magi_t4_smoke_v0.1
  config: configs/tokenizer_t4_smoke_v0.1.yaml
  artifact: tokenizer/artifacts/magi_t4_smoke_v0.1.json
  vocab_size: 8192

hf:
  model_type: magi
  architecture: MagiForCausalLM
  use_cache: true
  return_dict: true
  tie_word_embeddings: true
