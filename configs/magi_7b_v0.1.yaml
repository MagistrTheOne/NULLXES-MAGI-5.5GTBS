# MAGI-7B dense baseline v0.1 — comparison baseline ONLY
# NOT the H200 canonical research path. Canonical bring-up is configs/magi_7b_moe_v0.1.yaml.
# ENGINEERING SCALING RULE: reducing params is allowed; changing architecture is not.
# Dense models may exist only as explicit baselines.

meta:
  name: MAGI-7B-DENSE-BASELINE
  version: v0.1
  program_parent: MAGI-5.5GTBS
  status: dense_baseline_only
  from_zero: true
  model_class: dense_decoder
  primary_role: dense_comparison_baseline
  parent_family: magi_casual
  tokenizer_ref: configs/tokenizer_bringup_8k_v0.1.yaml
  hf_architecture: MagiForCausalLM
  research_reference: true
  canonical_research_path: false
  canonical_training_target: false
  scaling_path: false
  production_pretraining_allowed: false
  notes: "A/B vs MoE only. Never 100B tokens. Never default train target."

architecture:
  type: decoder_only_prenorm_dense
  d_model: 4096
  n_layers: 36
  n_heads: 32
  n_kv_heads: 8
  d_head: 128
  d_ff: 11008
  vocab_size: 8192
  tied_embeddings: true
  norm: rmsnorm
  rmsnorm_eps: 1.0e-6
  activation: swiglu
  positional: rope
  rope_theta: 1000000.0
  bias: false
  attention: gqa
  train_context: 4096
  infer_context: 8192
  moe: false

init:
  emb_std: 0.02
  residual_std_formula: "0.02 / sqrt(2 * n_layers)"
  claim_class: HYPOTHESIS

precision:
  proxy: bf16
  production: bf16
  master_weights: fp32
  loss: fp32

hardware:
  target: H200_SXM
  gpu_vram_gb: 141
  dtype: bfloat16
  recommended_batch: 1
  recommended_seq: 2048
  notes: "Dense baseline only. Canonical H200 path is MAGI-7B-MoE."

tokenizer:
  id: magi_bringup_8k_v0.1
  config: configs/tokenizer_bringup_8k_v0.1.yaml
  artifact: tokenizer/artifacts/magi_bringup_8k_v0.1.json
  vocab_size: 8192

hf:
  model_type: magi
  architecture: MagiForCausalLM
  use_cache: true
  return_dict: true
  tie_word_embeddings: true
