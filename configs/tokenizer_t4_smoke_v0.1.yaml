# MAGI T4 smoke tokenizer v0.1
# Small byte-BPE for Colab/T4 GPU smoke. Production remains 131072 vocab experiments.

meta:
  name: MAGI_T4_SMOKE_TOKENIZER
  version: v0.1
  program_parent: MAGI-5.5GTBS
  status: hardware_smoke_gate
  from_zero: true
  paired_model_config: configs/magi_t4_smoke_v0.1.yaml

tokenizer:
  algorithm: byte_bpe
  vocab_size: 8192
  byte_fallback: true
  normalization: NFKC
  unk_token: "<unk>"
  pad_token: "<pad>"
  bos_token: "<bos>"
  eos_token: "<eos>"
  special_tokens:
    - "<unk>"
    - "<pad>"
    - "<bos>"
    - "<eos>"

training:
  seed_corpus: tokenizer/data/t4_smoke_seed.txt
  min_merge_freq: 2
  max_merges: 7932

artifacts:
  tokenizer_json: tokenizer/artifacts/magi_t4_smoke_v0.1.json
  report: tokenizer/reports/t4_smoke_tokenizer_v0.1.md

gates:
  unknown_rate_max: 0.0
  roundtrip_required: true
  vocab_size_exact: 8192
