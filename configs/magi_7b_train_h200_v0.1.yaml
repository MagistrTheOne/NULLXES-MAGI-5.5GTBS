# H200 train profile — MAGI-7B-MoE SCALE_0
# BASE pretraining REQUIRES MAGI_TOKENIZER_V1. bringup_8k forbidden.

meta:
  name: MAGI_7B_MOE_H200_TRAIN
  version: v0.1
  model_config: configs/magi_7b_moe_v0.1.yaml
  scale: SCALE_0
  production_pretraining_allowed: false
  blocked_until: MAGI_TOKENIZER_V1
  corpus: data/synthetic/magi_synth_v0.1/golden/records.jsonl
  corpus_note: "synthetic golden is runtime/pipeline probe only — NOT MAGI BASE"

train:
  steps: 2000
  batch_size: 1
  seq_len: 2048
  lr: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  max_grad_norm: 1.0
  seed: 42
  use_amp: true
  amp_dtype: bf16
  require_loss_improve: false
  checkpoint_dir: artifacts/h200_7b_moe_train
  checkpoint_every: 100
  save_optimizer: false
  production_checkpoint_allowed: false

hardware:
  target: H200_SXM
  master_weights: float32
  compute: bfloat16_autocast
  architecture: sparse_moe
  notes: "Refuse BASE run until MAGI_TOKENIZER_V1 frozen. Use --allow-runtime-probe only for non-BASE engineering checks."
