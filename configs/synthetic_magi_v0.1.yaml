# MAGI synthetic bring-up corpus v0.2
# Deterministic templates only. No external LLM runtime.
# Regime: pipeline validation — NOT production pretraining mixture.

meta:
  name: MAGI_SYNTH_V0.2
  version: v0.2
  program_parent: MAGI-5.5GTBS
  dataset_id: magi_synth_v0.2
  generator_id: magi_synth_templates_v0.2
  license_status: NULLXES_SYNTHETIC
  source_type: nullxes_synthetic
  regime: bring_up_not_production_pretrain

generate:
  n_docs: 5000
  seed: 42
  dedup: semantic_hash

domain_weights:
  mathematics: 0.16
  programming: 0.16
  reasoning: 0.14
  science: 0.12
  systems: 0.12
  multilingual: 0.12
  dialogue: 0.10
  structured_data: 0.08

tokenizer:
  vocab_size: 8192
  artifact: tokenizer/artifacts/magi_bringup_8k_v0.1.json
  paired_model_config: configs/magi_7b_moe_v0.1.yaml

packing:
  seq_len: 128
  target_tokens_per_shard: 65536
  split: train

output:
  root: artifacts/synthetic/magi_synth_v0.2
  golden_docs: 64
  golden_root: data/synthetic/magi_synth_v0.2/golden
