# MAGI T4 single-GPU training smoke profile
# Native MAGITransformer + AdamW + fp16 autocast. Not Megatron production path.

meta:
  name: MAGI_T4_TRAIN_SMOKE
  version: v0.1
  program_parent: MAGI-5.5GTBS
  status: hardware_train_smoke_gate
  model_config: configs/magi_t4_smoke_v0.1.yaml
  corpus: tokenizer/data/t4_smoke_seed.txt

train:
  steps: 20
  batch_size: 1
  seq_len: 128
  lr: 1.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  max_grad_norm: 1.0
  seed: 42
  use_amp: true
  require_loss_improve: true
  checkpoint_dir: artifacts/t4_train_smoke

hardware:
  target: tesla_t4
  master_weights: float32
  compute: float16_autocast
  notes: "fp32 master weights + fp16 autocast; seq 128 x batch 1 for 15GB T4"
