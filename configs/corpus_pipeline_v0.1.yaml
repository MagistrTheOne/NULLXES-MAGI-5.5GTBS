# Corpus pipeline architecture v0.1

meta:
  name: MAGI_CORPUS_PIPELINE
  version: v0.1
  program_parent: MAGI-5.5GTBS
  data_program_ref: data/program/MAGI_DATA_MANIFEST_v0.1.yaml
  quality_law_ref: data/program/MAGI_DATA_QUALITY_LAW_v0.1.md
  dataset_content_defined_later_by_author: false
  local_workstation_bulk_download: FORBIDDEN
  ingest_requires: MAGI_DATA_PILOT_APPROVED
  ingest_scope: PILOT_V0.1
  production_ingest_env: MAGI_DATA_PRODUCTION_APPROVED
  production_ingest_exists: false

pipeline:
  stages:
    - raw_ingest
    - provenance_capture
    - legal_license_filter
    - parser
    - normalizer
    - language_detection
    - quality_scoring
    - exact_dedup
    - fuzzy_dedup
    - contamination_filter
    - privacy_filter
    - safety_filter
    - domain_classifier
    - curriculum_weighting
    - tokenizer
    - sequence_packing
    - shard_writer
    - manifest_writer

synthetic_interface:
  accepted: true
  requires_generator_manifest: true
  requires_semantic_pins: true
  requires_license_class: NULLXES_SYNTHETIC
  no_external_llm_runtime_dependency: true
  character_mass_generation: FORBIDDEN
  volume_inflation: FORBIDDEN

layers:
  BASE:
    mixture_ref: data/program/MAGI_DATA_MANIFEST_v0.1.yaml
  CASUAL:
    mixture_ref: data/program/casual/MAGI_CASUAL_MIX_v0.1.yaml
  CHARACTER:
    spec_ref: data/program/character/MAGI_CHARACTER_SPEC_v0.1.yaml
    preference_schema: schemas/magi_character_preference.schema.json

domains:
  - general_language
  - science
  - mathematics
  - engineering
  - programming
  - systems
  - robotics
  - economics
  - law
  - history
  - philosophy
  - dialogue
  - reasoning
  - structured_data
  - multilingual
  - casual_dialogue
  - policy_conditioned_dialogue
  - character_preference

shards:
  format: token_packed_binary_with_json_manifest
  document_boundaries_preserved: preferred
  config_hash_required: true
  tokenizer_hash_required: true
  lineage_required: true

quality_gates:
  license_unknown_action: quarantine
  exact_dedup_required: true
  fuzzy_dedup_required: true
  contamination_filter_required: true
  pii_filter_required: true
  row_count_is_not_quality: true
  gb_downloaded_is_not_quality: true
